aid: splitwise
name: Splitwise
description: >-
  Splitwise is an expense-sharing and bill-splitting service that helps
  roommates, travel groups, couples, and friends track shared costs and settle
  up fairly. Its public Self-Serve REST API (v3.0) lets third-party applications
  read and manage a user's groups, friends, expenses, comments, and
  notifications on that user's behalf, authenticating with OAuth 2.0 or a
  personal API key. Splitwise was added to the API Evangelist network from a
  venture-capital portfolio lead and has been enriched from its public developer
  documentation and OpenAPI specification.
